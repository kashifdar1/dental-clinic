services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: clinic_hub_bootstrap
      POSTGRES_PASSWORD: local-bootstrap-only
      POSTGRES_DB: clinic_hub
    ports:
      - "127.0.0.1:${PG_PORT:-54329}:5432"
    volumes:
      - clinic-hub-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinic_hub_bootstrap -d clinic_hub"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  clinic-hub-postgres:
