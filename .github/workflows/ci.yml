name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: clinic_hub_bootstrap
          POSTGRES_PASSWORD: local-bootstrap-only
          POSTGRES_DB: clinic_hub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clinic_hub_bootstrap -d clinic_hub"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      NODE_ENV: test
      ALLOW_LOCAL_DB_BOOTSTRAP: 'true'
      BOOTSTRAP_DATABASE_URL: postgres://clinic_hub_bootstrap:local-bootstrap-only@localhost:5432/clinic_hub
      DATABASE_URL: postgres://clinic_hub_app_login:local-app-only@localhost:5432/clinic_hub
      MIGRATION_DATABASE_URL: postgres://clinic_hub_migrator_login:local-migrator-only@localhost:5432/clinic_hub
      RLS_TEST_DATABASE_URL: postgres://clinic_hub_bootstrap:local-bootstrap-only@localhost:5432/clinic_hub_test
      RLS_TEST_APP_DATABASE_URL: postgres://clinic_hub_app_login:local-app-only@localhost:5432/clinic_hub_test
      RLS_TEST_PLATFORM_DATABASE_URL: postgres://clinic_hub_platform_login:local-platform-only@localhost:5432/clinic_hub_test
      RLS_TEST_MIGRATION_DATABASE_URL: postgres://clinic_hub_migrator_login:local-migrator-only@localhost:5432/clinic_hub_test
      APP_DB_PASSWORD: local-app-only
      MIGRATOR_DB_PASSWORD: local-migrator-only
      PLATFORM_DB_PASSWORD: local-platform-only

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Tenant database isolation tests
        run: npm run test:db

      - name: API tests
        run: npm run test:api

      - name: API typecheck and build
        run: npm run typecheck:api && npm run build:api

      - name: Build modular monolith workspace shells
        run: |
          npm run build:worker
          npm run build:web-console
          npm run build:web-platform
          npm run build:web-public

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Build
        run: npm run build

  browser:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Run browser tests
        run: npm run test:e2e

      - name: Upload browser reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
